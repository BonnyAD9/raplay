[package]
name = "raplay"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0"
description = "Library for playing audio"
homepage = "https://github.com/BonnyAD9/raplay"
repository = "https://github.com/BonnyAD9/raplay"
readme = "README.md"
keywords = ["audio"]
categories = ["multimedia::audio"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.102"
cpal = "0.17.3"
dasp_sample = "0.11.0"
num = "0.4.3"
serde = { version = "1.0.228", features = ["std", "derive"], optional = true }
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2.0.18"

[features]
default = []
serde = ["dep:serde"]
